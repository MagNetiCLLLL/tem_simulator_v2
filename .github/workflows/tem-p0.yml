name: Classical particle software acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation environment
        run: python -m pip install -r requirements/validation-cpu-lock.txt -e ".[dev]"
      - name: Build wheel and isolated CPU installation
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir outputs/spec-acceptance-wheel .
          python -m venv outputs/acceptance-install
          outputs/acceptance-install/Scripts/python.exe -m pip install -r requirements/validation-cpu-lock.txt outputs/spec-acceptance-wheel/tem_simulator_v2-0.1.0-py3-none-any.whl
      - name: Run bounded classical scope (not full-image qualification)
        run: python scripts/validate_classical_scope.py --scope classical --output outputs/spec-acceptance
      - name: Retain validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-spec-validation
          path: |
            outputs/spec-acceptance
  full-scope-status:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report legacy blockers without launching paused wave calculations
        env:
          PYTHONPATH: src
        run: python scripts/validate_classical_scope.py --scope full-report --output outputs/full-scope-status
      - name: Retain incomplete full-scope report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scope-status-not-qualified
          path: outputs/full-scope-status
