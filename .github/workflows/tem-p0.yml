name: Classical particle and diagnostic acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation environment
        id: environment
        run: |
          python -m pip install -r requirements/validation-cpu-lock.txt -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Validation dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Validation dependencies are inconsistent" }
      - name: Build wheel and isolated CPU installation
        id: wheel
        run: |
          $InstallRoot = Join-Path $env:RUNNER_TEMP ("temsim-acceptance-install-" + [guid]::NewGuid().ToString("N"))
          $WheelDir = Join-Path $InstallRoot "wheel"
          $VenvDir = Join-Path $InstallRoot "venv"
          New-Item -ItemType Directory -Path $WheelDir | Out-Null
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir $WheelDir .
          if ($LASTEXITCODE -ne 0) { throw "Wheel build failed" }
          $Wheels = @(Get-ChildItem -Path $WheelDir -Filter "tem_simulator_v2-*.whl" -File)
          if ($Wheels.Count -ne 1) { throw "Expected exactly one newly built application wheel" }
          python -m venv $VenvDir
          if ($LASTEXITCODE -ne 0) { throw "Isolated environment creation failed" }
          $InstalledPython = Join-Path $VenvDir "Scripts/python.exe"
          & $InstalledPython -m pip install -r requirements/validation-cpu-lock.txt $Wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Isolated wheel installation failed" }
          & $InstalledPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Installed dependencies are inconsistent" }
          "installed-python=$InstalledPython" >> $env:GITHUB_OUTPUT
          "install-root=$InstallRoot" >> $env:GITHUB_OUTPUT
      - name: Check isolated particle and diagnostic startup without coherent execution
        env:
          INSTALLED_PYTHON: ${{ steps.wheel.outputs.installed-python }}
          INSTALL_ROOT: ${{ steps.wheel.outputs.install-root }}
        run: |
          $SmokeScript = Join-Path $env:GITHUB_WORKSPACE "scripts/installation_diagnostic_smoke.py"
          $SmokeOutput = Join-Path $env:GITHUB_WORKSPACE "outputs/spec-acceptance-install/report.json"
          Push-Location $env:INSTALL_ROOT
          try {
            & $env:INSTALLED_PYTHON -I $SmokeScript --output $SmokeOutput
            $SmokeCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          exit $SmokeCode
      - name: Run bounded classical scope (not full-image qualification)
        # Collect independent scope evidence even when the installation fails.
        # Earlier failures still fail this job; no continue-on-error is used.
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python scripts/validate_classical_scope.py --scope classical --output outputs/spec-acceptance --allow-gpu-skips
      - name: Retain validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-spec-validation
          path: |
            outputs/spec-acceptance
            outputs/spec-acceptance-install
  feature-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope: [acceptance-policy, gun-fields, electron-execution, field-ui, particle-continuation, performance-observation, coherent-development]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation environment
        run: |
          python -m pip install -r requirements/validation-cpu-lock.txt -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Validation dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Validation dependencies are inconsistent" }
      - name: Run declared scope with one numerical thread
        # Hosted Windows runners have no CUDA device. Keep real-GPU tests in
        # collection and report normal skips as NOT_RUN, never as GPU success.
        run: python scripts/validate_classical_scope.py --scope ${{ matrix.scope }} --output outputs/agent-validation/${{ matrix.scope }} --timeout-seconds 1800 --allow-gpu-skips
      - name: Retain scope evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.scope }}
          path: outputs/agent-validation/${{ matrix.scope }}
          if-no-files-found: error
  full-scope-status:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal report runtime
        run: python -m pip install -c requirements/validation-cpu-lock.txt threadpoolctl
      - name: Report full-chain limitations without launching full coherent calculations
        env:
          PYTHONPATH: src
        run: python scripts/validate_classical_scope.py --scope full-report --output outputs/full-scope-status
      - name: Retain incomplete full-scope report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scope-status-not-qualified
          path: outputs/full-scope-status
