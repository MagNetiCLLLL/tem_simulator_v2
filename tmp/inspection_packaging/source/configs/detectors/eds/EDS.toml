eds_geometry_source = "The installed geometry reference uses published specifications for a six-segment, windowless, sample-facing EDS arrangement: >4.45 sr unshadowed and 4.04 sr with the analytical double-tilt holder. Public sources do not provide segment area, sensor distance, active-face shape, collimator aperture or package dimensions. Published XPAD work confirms that approximately 4.1-4.6 sr performance required a jointly designed detector, low-penumbra holder and custom objective pole piece. A published instrument report and the inspected user dataset support six signals/segments. FEI multi-detector patents support sample-facing detectors within the TEM objective-lens region only at family/topology level. The symmetric azimuth phase and physical drawing size are non-OEM schematics pending user cross-sections."
