[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tem-simulator-v2"
version = "0.1.0"
description = "Transmission electron microscope simulation and control GUI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "abtem==1.0.10",
    "ase>=3.29,<4",
    "imageio>=2.37,<3",
    "matplotlib",
    "manifold3d>=3.5.1,<4",
    "numba",
    "numpy",
    "pyqtgraph",
    "PyOpenGL>=3.1.7,<4",
    "pillow>=11,<13",
    "PySide6==6.8.3",
    "scipy",
    "tomli-w",
    "tifffile>=2025,<2027",
    "xraylib==4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]
gpu = [
    "cupy-cuda12x>=14,<15",
]
atomistic = []

[project.scripts]
tem-simulator = "temsim.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"temsim.gui" = ["assets/*.svg"]

[tool.setuptools.data-files]
"configs/instruments" = ["configs/instruments/catalog.toml"]
"configs/instruments/column" = ["configs/instruments/column/*.toml"]
"configs/instruments/gun" = ["configs/instruments/gun/*.toml"]
"configs/instruments/beam_blanker" = ["configs/instruments/beam_blanker/*.toml"]
"configs/instruments/project_and_recording_system" = [
    "configs/instruments/project_and_recording_system/*.toml",
]
"configs/detectors/eds" = ["configs/detectors/eds/*.toml"]
"configs/physics/eds" = ["configs/physics/eds/*.json"]
"configs/specimens" = ["configs/specimens/*.toml"]
"configs/reference_samples" = ["configs/reference_samples/*.cif", "configs/reference_samples/*.toml", "configs/reference_samples/*.md"]
"configs/specimen_supports" = ["configs/specimen_supports/*.toml"]
"configs/operating_modes" = ["configs/operating_modes/*.toml"]
"configs/materials" = ["configs/materials/lens_defaults.toml"]
"configs/materials/magnetic" = ["configs/materials/magnetic/*.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
