# Source reference (separate from the installable instrument-module catalog).
# Reference geometry, not an OEM reconstruction or a calibrated source.
schema = "grounded-cold-feg-surface-v1"
status = "idealised_reference_not_calibrated"
potential_reference = "final_accelerating_anode_ground_0V"
geometry_reference = "https://www.jeol.com/words/semterms/20121024.062458.php"
# JEOL supports W(310) and an approximately 100 nm apex radius. The cone,
# shank, emission patch and distributions below are explicit model choices.

[geometry]
shape = "spherical_cap_tangent_cone"
material = "W(310)"
apex_radius_nm = 100.0
# Physical curvature radius R. The emitting patch has a separate polar angle;
# its projected diameter and surface arc length are DERIVED, not source inputs.
cone_half_angle_deg = 5.0
shank_length_um = 1000.0

[emission]
# Prescribed outgoing flux at the tip surface, not a Fowler-Nordheim prediction.
# A classical reference distribution, NOT an independently specified gun exit.
current_na = 100.0
cap_half_angle_deg = 10.0
# Geometric polar angle at the sphere centre, not electron angular spread.
# theta [rad] = theta [deg] * pi/180; diameter = 2R*sin(theta),
# apex-to-edge arc = R*theta, depth = 2R*sin(theta/2)^2.
# Geometry and emission can be edited in Model Inspector > FEG tip and saved
# in an operating profile. Loading this reference never edits an old profile.
# Independent positive exponential normal and tangential energy components.
# Total mean, energy spread and angular spread are derived, not extra inputs.
normal_mean_energy_ev = 0.2
tangential_mean_energy_ev = 0.1

[field_numerics]
# Vacuum Laplace solution: axisymmetry; space charge is not included.
radial_nodes = 160
axial_nodes = 320
apex_cells_per_radius = 20
outer_radius_factor = 1.25
linear_residual_tolerance = 1e-9
# Accelerator rings are idealised annular conductors, not the housing envelope.
accelerator_ring_thickness_mm = 1.0

# Opt-in coherent surface reservoir. Uncomment only to select this model;
# historical/classical normal and tangential energies above then become inactive.
# This is a prescribed post-emission boundary, not tunnelling or a gun exit.
# [coherence]
# model = "coherent-cap-reservoir-v1"
# mean_energy_ev = 0.3
# energy_rms_ev = 0.1
# edge_phase_rad = 0.0
