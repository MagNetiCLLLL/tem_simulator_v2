# Shared physical tip definition for every explicitly linked FEG assembly.
# Edit here or through an installed feg_tip; all linked scenes use these values.
format_version = 1
coordinate_system = "module_local_z_mm"
[module]
type = "component"
key = "part:feg_tip"
name = "FEG tip"
[ports.entrance]
interface = "electron_source_reference"
local_z_mm = -1.0
[ports.exit]
interface = "electron_source_reference"
local_z_mm = 0.0
[geometry]
length_mm = 1.0
vacuum_drift_inner_diameter_mm = 5.0
vacuum_liner_wall_thickness_mm = 0.25
parts_start_z_mm = -1.0
parts_end_z_mm = 0.0
[[parts]]
order = 1
key = "feg_tip"
name = "Cold Field Emission Tip"
tip_surface_reference_file = "sources/cold_feg_tip.toml"
branch = "common"
local_start_z_mm = -1.0
local_center_z_mm = -0.5
local_end_z_mm = 0.0
length_mm = 1.0
vacuum_inner_diameter_mm = 5
optical_reference_local_z_mm = 0.0
outer_diameter_mm = 0.1751605932866515
# Fresh installations use Flat tip; curved geometry remains an explicit option.
default_tip_emission = "flat_tip"
# Optional curved particle tip definition. Curvature = 1/tip_radius_nm (nm^-1).
# Electron flux is per physical emitting area per second, within the angular
# limit. It is prescribed emission, not a tunnelling-current prediction.
tip_particle_model = "curved_surface_particles"
tip_shape = "spherical_cap_tangent_cone"
tip_material = "W(310)"
tip_radius_nm = 100.0
tip_cone_half_angle_deg = 5.0
emission_flux_electrons_per_nm2_s = 653864449.6443435
emission_cap_half_angle_deg = 10.0
# Ray budget is shared between sites and local directions; total flux is unchanged.
emission_directions_per_position = 8
emission_maximum_angle_deg = 90.0
emission_energy_distribution = "normal_tangential_exponential"
emission_normal_mean_energy_ev = 0.2
emission_tangential_mean_energy_ev = 0.1
# Used by gamma / monoenergetic laws; their directions are uniform solid angle
# inside emission_maximum_angle_deg about each local outward surface normal.
emission_kinetic_mean_ev = 0.3
emission_kinetic_sigma_ev = 0.1
tip_field_radial_nodes = 160
tip_field_axial_nodes = 320
tip_apex_cells_per_radius = 20
tip_field_outer_radius_factor = 1.25
tip_field_residual_tolerance = 1e-9
# Numerical controls only; neither changes the physical emitting cap.
tip_field_axis_core_fraction = 0.01
tip_field_electrode_cells_per_bore = 8
