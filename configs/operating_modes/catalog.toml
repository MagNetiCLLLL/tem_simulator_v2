[[crossover_constraints]]
key = "c1_c2_interlens"
upstream_lens = "condenser_lens_1"
downstream_lens = "condenser_lens_2"
target_z_source = "pole_gap_midpoint"
applies_to_modes = ["micro_probe", "nano_probe"]
status = "confirmed"
note = "The crossover target is the mid-plane of the opposing C1-lower and C2-upper pole tips."

# Direct Alignment controls are user-level coupled solves, not extra field
# sources and not manufacturer lens tables.  The requested range is kept
# separate from the range reachable by the current non-OEM field model.  A
# failed or unreachable solve must leave every lens at its previous value.

[[direct_alignments]]
key = "spot_size_current_limit"
name = "Spot size — column-current limit"
family = "condenser"
mode_key = "micro_probe"
applies_to_modes = ["micro_probe", "nano_probe"]
unit = "%"
minimum = 0.1
maximum = 100.0
default_value = 100.0
devices = []
state_parameters = ["column_current_limit_percent"]
observable = "maximum_column_current_as_emitted_current_fraction"
constraint = "physical_current_cap_without_changing_numerical_ray_count"
calibration_status = "ideal_current_limit_no_oem_c1_current_table"
calibration_reference = "This ideal Spot-size control represents the beam-current role normally assigned to C1. It limits the physical current represented by normalized rays in both probe modes, without changing Monte Carlo ray count or C2/C3 optics. No measured C1 excitation-to-current or manufacturer spot-number table is available, so the low-level C1 field remains an independent editable optical parameter."
targets = { maximum_numerical_spread = 0.01, optimiser_step_mm = 0.1, validation_step_mm = 0.1 }

