format_version = 1
description = "Calculated FEI-style Microprobe/Nanoprobe and Image/Diffraction operating states."
# A calibrated default must not remain at 100% excitation. If a solver reaches
# saturation, increase that lens's maximum field and rebase the stored default
# into 30-70% while preserving maximum_field * percent / 100.
# field_polarity is the effective signed Bz direction in the source-to-detector
# +z coordinate. It is independent of the non-negative excitation percentage.

[[modes]]
key = "micro_probe"
name = "Microprobe (TEM)"
family = "condenser"
calibration_status = "retained_not_recomputed_after_c2_aperture_relocation"
calibration_reference = "Preset strengths and reported metrics are retained from the preceding 300 kV non-OEM C3 + Probe Corrector calibration with the C2 aperture at local Z 295 mm. The mechanical aperture plane is now local Z 315 mm; no optical-path or preset-strength recalculation was performed for this component move."
compatible_columns = ["C3 + Probe Corrector"]
compatible_recording_systems = ["*"]
devices = { condenser_lens_1 = { percent = 20.0 }, condenser_lens_2 = { percent = 17.526971067688827 }, condenser_lens_3 = { percent = 34.500911306851144 }, adapter_lens = { percent = 42.0 }, probe_tl22_lens = { percent = 60.0 }, probe_tl21_lens = { percent = 60.0 }, probe_tl12_lens = { percent = 60.0 }, mini_condenser = { percent = 35.0, field_polarity = 1 }, objective_lens = { percent = 68.9801 } }
apertures = { condenser_aperture_2 = { enabled = true, diameter_mm = 0.10 } }
targets = { beam_character = "quasi_parallel", maximum_convergence_sem_angle_mrad = 0.3, achieved_convergence_sem_angle_mrad = 0.26614575494115617, achieved_illumination_diameter_95_um = 2.001682266314471, achieved_wavefront_curvature_per_m = -2.839541631496529, c2_aperture_diameter_um = 100.0 }

