# Reusable mechanical module exported from the current TEM assembly.
# All coordinates are local to this module, not source-absolute.
# Positive z follows the electron-beam direction.

format_version = 1
coordinate_system = "module_local_z_mm"

[module]
type = "project_and_recording_system"
key = "project_and_recording_system:noenergyfilter"
name = "No Energy Filter"
energy_filter = false

[ports.entrance]
interface = "column_to_project_and_recording_system"
local_z_mm = 0.0

[ports.exit]
interface = "recording_system_end"
local_z_mm = 1350.0

[geometry]
length_mm = 1350.0
vacuum_drift_inner_diameter_mm = 20
vacuum_liner_wall_thickness_mm = 0.75
magnetic_lens_external_diameter_mm = 180.0
magnetic_lens_coil_axial_fraction = 0.9
magnetic_lens_coil_radial_thickness_base_mm = 6.0
magnetic_lens_coil_radial_thickness_per_t_mm = 3.0
magnetic_lens_geometry_status = "engineering_reconstruction_not_oem"
magnetic_lens_geometry_source = "User-directed constant-OD TEM-column reconstruction. Public JEOL objective-lens documentation and US4633085A/US20230154724A1 support topology and terminology only; dimensions are simulator engineering assumptions, not OEM measurements."
magnetic_lens_geometry_source_urls = ["https://www.jeol.com/words/emterms/20121023.060558.php", "https://patents.google.com/patent/US4633085A", "https://patents.justia.com/patent/20230154724"]
magnetic_lens_design_peak_fields_t = { diffraction_lens = 0.75, intermediate_lens = 0.830537725, projector_lens_1 = 0.42, projector_lens_2 = 0.36 }
projector_stack_inter_lens_gap_mm = 5.0
projector_stack_vacuum_inner_diameter_mm = 20.0
projector_stack_geometry_status = "user_defined_non_oem_principle_model"
projector_stack_geometry_source = "User requirement: compact D-I-P1-P2 stack with uniform vacuum tube; not an OEM production drawing."
parts_start_z_mm = 0.0
parts_end_z_mm = 1350.0

# The D-I-P1-P2 axial positions remain a Titan/Talos-class engineering
# reconstruction based on the user-supplied FEI public-reference scale; they
# are not OEM production measurements. The compact stack uses a uniform 5 mm
# service gap and 20 mm electron-accessible vacuum ID. Its magnetic-lens
# housings now share the 180 mm reconstructed column OD used by the condenser,
# objective and corrector lenses. The 174 mm housing ID surrounds a 170 mm
# magnetic yoke, while each strength-ranked coil remains inside that yoke. The
# pole mechanical bore is 21.5 mm before two 0.75 mm liner walls.

