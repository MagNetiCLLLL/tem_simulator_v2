# Reusable mechanical module exported from the current TEM assembly.
# All coordinates are local to this module, not source-absolute.
# Positive z follows the electron-beam direction.

format_version = 1
coordinate_system = "module_local_z_mm"

[module]
type = "project_and_recording_system"
key = "project_and_recording_system:noenergyfilter"
name = "No Energy Filter"
energy_filter = false

[ports.entrance]
interface = "column_to_project_and_recording_system"
local_z_mm = 0.0

[ports.exit]
interface = "recording_system_end"
local_z_mm = 1350.0

[geometry]
length_mm = 1350.0
vacuum_drift_inner_diameter_mm = 20
vacuum_liner_wall_thickness_mm = 0.75
projector_stack_inter_lens_gap_mm = 5.0
projector_stack_vacuum_inner_diameter_mm = 20.0
projector_stack_geometry_status = "user_defined_non_oem_principle_model"
projector_stack_geometry_source = "User requirement: compact D-I-P1-P2 stack with uniform vacuum tube; not an OEM production drawing."
parts_start_z_mm = 0.0
parts_end_z_mm = 1350.0

# The D-I-P1-P2 dimensions below are a Titan/Talos-class engineering
# reconstruction based on the user-supplied FEI public-reference scale.  They
# are not OEM production measurements. The compact stack uses a uniform 5 mm
# service gap and 20 mm electron-accessible vacuum ID between and through D,
# I, P1 and P2. The non-magnetic housing adds 3 mm radially outside the
# reference magnetic-yoke OD (1 mm clearance plus a 2 mm shell), and the pole
# mechanical bore is 21.5 mm before two 0.75 mm liner walls.

