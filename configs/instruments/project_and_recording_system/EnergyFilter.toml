# Compatibility entry: physical definitions live in three independent subassemblies.
# Placement is explicit; no implicit downstream packing or new source is introduced.
format_version = 1
coordinate_system = "module_local_z_mm"

[module]
type = "project_and_recording_system"
key = "project_and_recording_system:energyfilter"
name = "Energy Filter"
energy_filter = true

[ports.entrance]
interface = "column_to_project_and_recording_system"
local_z_mm = 0.0

[ports.exit]
interface = "recording_system_end"
local_z_mm = 1400.0

[geometry]
length_mm = 1400.0
vacuum_drift_inner_diameter_mm = 20
vacuum_liner_wall_thickness_mm = 0.75
magnetic_lens_external_diameter_mm = 180.0
magnetic_lens_coil_axial_fraction = 0.9
magnetic_lens_coil_radial_thickness_base_mm = 6.0
magnetic_lens_coil_radial_thickness_per_t_mm = 3.0
magnetic_lens_geometry_status = "engineering_reconstruction_not_oem"
magnetic_lens_geometry_source = "User-directed constant-OD TEM-column reconstruction. Public JEOL objective-lens documentation and US4633085A/US20230154724A1 support topology and terminology only; dimensions are simulator engineering assumptions, not OEM measurements."
magnetic_lens_geometry_source_urls = [
    "https://www.jeol.com/words/emterms/20121023.060558.php",
    "https://patents.google.com/patent/US4633085A",
    "https://patents.justia.com/patent/20230154724",
]
projector_stack_inter_lens_gap_mm = 5.0
projector_stack_vacuum_inner_diameter_mm = 20.0
projector_stack_geometry_status = "user_defined_non_oem_principle_model"
projector_stack_geometry_source = "User requirement: compact D-I-P1-P2 stack with uniform vacuum tube; not an OEM production drawing."
parts_start_z_mm = 0.0
parts_end_z_mm = 1400.0

[geometry.magnetic_lens_design_peak_fields_t]
diffraction_lens = 0.75
intermediate_lens = 0.830537725
projector_lens_1 = 0.42
projector_lens_2 = 0.36

[[subassemblies]]
key = "projector_stack"
name = "Imaging and projector stack"
file = "../../subassemblies/projector_stack.toml"

[subassemblies.placement]
mode = "fixed"
origin_z_mm = 0.0

[[subassemblies]]
key = "detector_chamber"
name = "Projection and detector chamber"
file = "../../subassemblies/detector_chamber.toml"

[subassemblies.placement]
mode = "anchor"
reference_part = "projector_lens_2_housing"
reference_point = "end"
offset_mm = 0.0
local_datum_mm = 0.0

[[subassemblies]]
key = "iliad_filter"
name = "Energy filter"
file = "../../subassemblies/energy_filter.toml"

[subassemblies.placement]
mode = "anchor"
reference_part = "camera"
reference_point = "end"
offset_mm = 38.75
local_datum_mm = 0.0
