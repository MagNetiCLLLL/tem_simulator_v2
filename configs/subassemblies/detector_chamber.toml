[[parts]]
order = 119
key = "projection_chamber_dpa_aperture"
name = "Projection-Chamber Differential-Pumping Aperture"
branch = "common"
local_start_z_mm = 0.0
local_center_z_mm = 0.0
local_end_z_mm = 0.0
length_mm = 0.0
vacuum_inner_diameter_mm = 20.0
mechanical_outer_diameter_mm = 20.0
mechanical_bore_diameter_mm = 12.0
reference_bore_diameter_mm = 0.2
maximum_radius_mm = 10.0
reference_bore_status = "documented_tecnai_talos_family_reference_not_titan_oem_measurement"
design_bore_status = "simulator_haadf_clearance_design_not_oem_dimension"
design_bore_source = "User-authorized simulator opening, 2026-09-08. A 6 mm radius clears the 168.8 mrad coherent HAADF support of the Si scan with radial margin in the ordinary nanoprobe/diffraction preset (DPA angular transfer about 32.26 mm/rad). Its DPA-limited upper angle is about 186 mrad; full 60-330 mrad collection still requires the saved DPA-crossover lens setting. The 0.2 mm literature reference is retained separately. Differential-pumping performance is not modelled."
mechanical_profile = "fixed_differential_pumping_aperture"
mechanical_part_role = "fixed_vacuum_restriction"
material_class = "vacuum_boundary_aperture_material_not_public"
mechanical_only = false
optical_reference_local_z_mm = 0.0
aperture_adjustability = "fixed_non_retractable_hardware_toml_design_variable"
mechanical_axial_thickness_status = "not_public_zero_length_reference_with_schematic_display_thickness"
conjugate_plane_status = "operating_mode_dependent_not_imposed_by_mechanical_layout"
optical_constraint_policy = "always_inserted_hard_edge_no_automatic_preset_recalculation"
mechanical_geometry_status = "documented_family_topology_titan_specific_dimensions_unverified"
mechanical_geometry_source = "FEI/Thermo Fisher manuals place a differential-pumping aperture between the column and projection chamber and document a 200 micrometre aperture for Tecnai/Talos-family instruments. The Titan-specific plate thickness and bore are not established by a production drawing; the zero-length axial row preserves the interface without inventing thickness."
mechanical_geometry_source_urls = [
    "https://imf.ucmerced.edu/sites/g/files/ufvvjh1081/f/documents/tem_talosbasicguide_1.pdf",
    "https://www.dartmouth.edu/emlab/docs/fei_tecnai_f20_column_description_doc.pdf",
]
